name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify version and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release.py --check --tag "$env:RELEASE_TAG"
      - run: python -B -m unittest -v
      - run: python tools/package_release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" "dist/uRename-$env:RELEASE_TAG.zip" "dist/SHA256SUMS.txt" --verify-tag --title "uRename $env:RELEASE_TAG" --notes-file dist/release-notes.md
